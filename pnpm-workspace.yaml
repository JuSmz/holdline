# Dependency install scripts run only when explicitly allowed (pnpm >= 10.26; required by pnpm 11+).
allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false

# Supply-chain guard: don't install versions younger than 3 days (minutes).
minimumReleaseAge: 4320

# drizzle-kit's deprecated @esbuild-kit loader pins esbuild 0.18 (GHSA-67mh-4wv8-2f99, dev server only).
# Lift it to the esbuild drizzle-kit itself already uses.
overrides:
  "@esbuild-kit/core-utils>esbuild": 0.25.12
